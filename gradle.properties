# ============================================================
# ServerStyler - Stonecutter multi-version build (root properties)
# Version-specific values live in the per-version subprojects.
# ============================================================

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Stonecutter + plugin versions (independent of MC target)
loader_version=0.20.1
# Consumed by dev.kikugie.loom-back-compat (picks remap/unobf Loom automatically).
loomx.loom_version=1.19.4

# Mod metadata (independent of MC target)
maven_group=pl.zelekdev.serverstyler
archives_base_name=serverstyler
mod_version=1.2.2
mod_id=serverstyler
mod_display_name=ServerStyler
mod_description=Custom RGB gradient and transparency server names in the multiplayer list.
mod_license=MIT
mod_authors=zelekdev,ServerStyler Contributors
mod_sources_url=https://github.com/zelekdev/ServerStyler
mod_issues_url=https://github.com/zelekdev/ServerStyler/issues

# MixinExtras version bundled via JiJ. 0.5.5 is the first release whose
# FactoryRedirectWrapperMixinTransformer tolerates the list-encoded `at` element
# that javac emits for @Redirect array members; 0.5.0-beta.4 throws a
# ClassCastException there and crashed the client. Bundling the fixed version
# makes Loader's "newest wins" resolution pick 0.5.5 even when another mod
# jar-in-jars the broken pre-release.
mixinextras_version=0.5.5